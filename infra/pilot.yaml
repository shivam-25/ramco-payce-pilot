AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Ramco Payce pilot. One Postgres+pgvector database per customer region.
  In production this same template deploys to ap-south-1 (IN) and me-central-1 (UAE);
  this AWS project is SCP-locked to a single region, so both instances run here with
  separate credentials, separate security groups and no shared connection.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  RouteTableIds:
    Type: CommaDelimitedList
    Description: Route tables the S3 gateway endpoint attaches to
  DBInstanceClass:
    Type: String
    Default: db.t4g.micro
  EngineVersion:
    Type: String
    Default: '18.6'

Resources:

  # ---- networking -------------------------------------------------------
  # One security group for the AgentCore runtime ENIs, one for each database.
  # The databases accept 5432 ONLY from the runtime group. Nothing is public.

  RuntimeSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Ramco pilot AgentCore runtime ENIs
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Bedrock, Secrets Manager and S3 over TLS
      Tags: [{ Key: Project, Value: ramco-payce-pilot }]

  DBSecurityGroupIN:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Ramco pilot - India database
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref RuntimeSG
          Description: AgentCore runtime only
      Tags: [{ Key: Project, Value: ramco-payce-pilot }, { Key: DataRegion, Value: IN }]

  DBSecurityGroupUAE:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Ramco pilot - UAE database
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref RuntimeSG
          Description: AgentCore runtime only
      Tags: [{ Key: Project, Value: ramco-payce-pilot }, { Key: DataRegion, Value: UAE }]

  # ---- private egress ---------------------------------------------------
  # The runtime runs in VPC mode so it can reach databases that are not
  # publicly accessible. In VPC mode the container has no internet route of
  # its own, and it needs one before it can even start: AgentCore pulls the
  # image from ECR and ships logs to CloudWatch before any of this code runs.
  # That is why the first VPC-mode deploy came up READY and then failed every
  # invocation with a 400 and not one line of log output.
  #
  # Two ways to give it that reachability, both measured rather than assumed:
  #
  #   Interface endpoints, one per service. AWS's own VPC sample for
  #   AgentCore uses thirteen (ECR api and dkr, CloudWatch Logs and
  #   Monitoring, Bedrock Runtime, AgentCore, Secrets Manager, KMS, X-Ray,
  #   S3, ...). At about USD 7.30 per endpoint per month that is roughly
  #   USD 66 a month before a single token is spent.
  #
  #   One NAT gateway. About USD 32 a month plus USD 0.045 per GB, covers
  #   every AWS API the container needs, and is one resource to reason about
  #   instead of thirteen.
  #
  # The NAT is chosen: half the cost, and it does not have to be revisited
  # every time the runtime starts calling one more AWS service. The S3
  # gateway endpoint is kept because it is free and keeps artifact pulls off
  # the metered path. The databases remain PubliclyAccessible: false either
  # way — this is about outbound reach, not inbound exposure.

  NatEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags: [{ Key: Project, Value: ramco-payce-pilot }]

  Nat:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Select [0, !Ref SubnetIds]      # must live in a public subnet
      Tags: [{ Key: Project, Value: ramco-payce-pilot }]

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcId
      Tags: [{ Key: Name, Value: ramco-pilot-private }]

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref Nat

  # Two private subnets, in two availability zones, carved out of spare
  # space in the default VPC. The runtime's network interfaces live here:
  # outbound through the NAT, nothing inbound from the internet.
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      CidrBlock: 172.31.240.0/20
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: ramco-pilot-private-a }]

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      CidrBlock: 172.31.224.0/20
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: ramco-pilot-private-b }]

  PrivateSubnetARoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnetA, RouteTableId: !Ref PrivateRouteTable }

  PrivateSubnetBRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnetB, RouteTableId: !Ref PrivateRouteTable }

  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRouteTable]

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Ramco pilot databases
      SubnetIds: !Ref SubnetIds

  # ---- secrets ----------------------------------------------------------
  # Separate secret per region. The runtime resolves exactly one of them,
  # chosen by the router from the customer's region. There is no code path
  # that holds both connections open at once.

  DBSecretIN:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: ramco/pilot/db/IN
      Description: Ramco pilot India database credentials
      GenerateSecretString:
        SecretStringTemplate: '{"username":"ramco_in"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\''`'

  DBSecretUAE:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: ramco/pilot/db/UAE
      Description: Ramco pilot UAE database credentials
      GenerateSecretString:
        SecretStringTemplate: '{"username":"ramco_uae"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\''`'

  # ---- databases --------------------------------------------------------
  # db.t4g.micro, single-AZ, 20 GB gp3, no public access, 1-day backups.
  # Sized to sit inside the free-tier class on a ~USD 100 credit balance.
  # Each instance holds structured data, vectors and the semantic cache:
  # one database, one hop, as the study note argues.

  DBInstanceIN:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    Properties:
      DBInstanceIdentifier: ramco-in
      DBName: ramco
      Engine: postgres
      EngineVersion: !Ref EngineVersion
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: '20'
      StorageType: gp3
      MultiAZ: false
      PubliclyAccessible: false
      BackupRetentionPeriod: 1
      DeletionProtection: false
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups: [!Ref DBSecurityGroupIN]
      MasterUsername: !Sub '{{resolve:secretsmanager:${DBSecretIN}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DBSecretIN}:SecretString:password}}'
      Tags: [{ Key: Project, Value: ramco-payce-pilot }, { Key: DataRegion, Value: IN }]

  DBInstanceUAE:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    Properties:
      DBInstanceIdentifier: ramco-uae
      DBName: ramco
      Engine: postgres
      EngineVersion: !Ref EngineVersion
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: '20'
      StorageType: gp3
      MultiAZ: false
      PubliclyAccessible: false
      BackupRetentionPeriod: 1
      DeletionProtection: false
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups: [!Ref DBSecurityGroupUAE]
      MasterUsername: !Sub '{{resolve:secretsmanager:${DBSecretUAE}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DBSecretUAE}:SecretString:password}}'
      Tags: [{ Key: Project, Value: ramco-payce-pilot }, { Key: DataRegion, Value: UAE }]

  SecretAttachIN:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref DBSecretIN
      TargetId: !Ref DBInstanceIN
      TargetType: AWS::RDS::DBInstance

  SecretAttachUAE:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref DBSecretUAE
      TargetId: !Ref DBInstanceUAE
      TargetType: AWS::RDS::DBInstance

Outputs:
  RuntimeSubnetList:
    Description: Private subnets the AgentCore runtime attaches to
    Value: !Join [',', [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]

  RuntimeSecurityGroup: { Value: !Ref RuntimeSG }
  SubnetList:           { Value: !Join [',', !Ref SubnetIds] }
  EndpointIN:           { Value: !GetAtt DBInstanceIN.Endpoint.Address }
  EndpointUAE:          { Value: !GetAtt DBInstanceUAE.Endpoint.Address }
  SecretArnIN:          { Value: !Ref DBSecretIN }
  SecretArnUAE:         { Value: !Ref DBSecretUAE }
